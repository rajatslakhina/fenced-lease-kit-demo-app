name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS 15 — resolve the remote package, then build the app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # This is the load-bearing step. It proves the package reference in
      # project.pbxproj genuinely resolves from GitHub at the pinned version —
      # not from a local path, and not from whatever `main` happens to be today.
      - name: Resolve the remote Swift package
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo

      - name: Show what actually resolved
        run: cat Demo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      # `generic/platform=iOS Simulator` deliberately, never a named device.
      # Pinning to `name=iPhone 16,OS=latest` would tie this job to whichever
      # simulator *runtimes* happen to be installed on that day's runner image,
      # which is not guaranteed and can fail with `Unable to find a device matching
      # the provided destination specifier` on a commit that changed nothing
      # relevant. A compile-only check needs no device to exist.
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project Demo.xcodeproj \
            -scheme Demo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
